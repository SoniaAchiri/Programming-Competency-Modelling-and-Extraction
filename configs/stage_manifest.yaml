# Stage manifest — THE audit index of this repository.
#
# Every number cited below is real and cross-referenced against ../provenance/detector-version-log.md — no
# entry here is invented or estimated. `evidence` on each stage says plainly whether a real batch CSV
# backs the number or whether it's conversation/paper-reported only. As of the 2026-08-05 round, every *_final
# stage for Q1-Q5 (q1_final, q2_final, q3_final, q4_final, q5_final) is `evidence: real_csv` — the
# intermediate/superseded stages (q1_prefix, q3_prefix, q4_bubblesort_only, q4_topkpattern_transferred,
# q5_whole_file, q5_unscoped_post_refactor) remain conversation_reported_only, multiply corroborated across
# independent documents but not backed by a supplied CSV of their own. `data_file` is only populated where
# that file genuinely exists in this repo; everywhere else it says PENDING rather than pointing at a path
# that doesn't exist.
#
# An earlier version of this manifest invented a Q1 "76.8%->99.5%" trail, a Q5 "->79.7%->91.9%" trail, a
# nonexistent TopKPatternExtended/DELEGATES+SELF_RECURSIVE fix, and an entire fabricated Table 5 section.
# None of that survived contact with Sonia's real checkpoints and conversation exports. See ../VERSIONING.md's
# "Corrected from an earlier, guessed version" note.
#
# coverage_threshold: the final_score cutoff counted as "covered." Q5's real topk_report.csv uses
# final_score == 1.0 exactly (full marks on both coverage and structural axes) — confirmed by direct
# inspection of the CSV, not assumed.
coverage_threshold: 1.0

