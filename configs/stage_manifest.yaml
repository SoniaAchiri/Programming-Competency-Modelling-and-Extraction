    corroborating_sources: 3
    source: "run_q1_Q4_batch_validation.docx (conversation, 2026-08-05); Competency_Extraction_Methodology.docx (2026-08-05) §5.2; Structural_Competency_Extraction_Paper_modif_2.pdf §5.3"
