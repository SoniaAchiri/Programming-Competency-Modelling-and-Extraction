    note: >
      Supersedes q5_final above as Table 4's reported Q5 headline (see table4_config.yaml), but does not
      replace it -- q5_final's 78.2%/75.0% TopKPattern-only figure remains preserved as a real, earlier
      checkpoint. This stage exists because an embedding-clustering discovery pass over Q5's 43
      correct-labeled + 5 wrong-labeled FindExtremum-scored-0 "novel" submissions (see
      detectors/semantic-backup-layer-validation/'s clustering-extended notebooks and
      provenance/detector-version-log.md's "Q5 delegation fix via embedding-guided clustering" section) found
      that ~38 of the 43 correct novel files share a delegation shape (top_k itself calls a
      differently-named helper and slices the result) invisible to function-scoped inline resolution.
      TWO new competencies close this gap: TopKViaDelegate (DELEGATES to TopKPattern -- catches helpers
      that repeat the exact find-max/remove/append shape) and SortThenSlice (DELEGATES to a new
      HasSubstantialWork check, which now covers LOOP *or* the newly-added SELF_RECURSIVE primitive --
      closing a real gap where a pure-recursion merge_sort helper had zero LOOP nodes and so was
      previously invisible to any "does real work" check). Real, verified, zero regressions (no row with
      TopKPattern_final==1 has TopKPatternExtended_final==0). A confirmed but uncharacterized caveat:
      TopKPattern's own combinatorial matcher has at least one latent false-positive mode (a bubble-sort-
      style insert/pop shuffle coincidentally satisfying its loop/test/removal shape -- confirmed on
      correct_5_416.py), newly exposed by delegation testing TopKPattern against a wider variety of
      helper-function bodies than inline-only resolution ever did; manually sample-checked 7 of 17
      TopKViaDelegate catches (6 genuine, 1 false positive == ~14% sample false-positive rate), so
      91.9%/80.6% is very likely a slight overstatement by an uncharacterized amount -- explicitly not
      claimed as a fully row-by-row-verified number the way the Q1 fix's 99.5%/97.6% was. Also newly real
      this round: a genuine 78.2% -> 79.7% baseline drift for TopKPattern's OWN (non-extended) correct-side
      coverage, confirmed by direct diff against the original topk_report.csv (exactly 6 correct files flip
      0->1, 0 wrong-side changes) and traced to the Q1 SHARED_BINDING/all_names fix (q1_shared_binding_fix)
      incidentally shifting a handful of TopKPattern's own combinatorial matches -- both figures
      independently re-verified, not assumed; q5_final above still correctly reports the original 78.2%
      as ITS OWN checkpoint's real figure at the time it was measured, not amended in place. Striking,
      purely coincidental resemblance to this repo's own corrected (fabricated) VERSIONING.md note, which
      guessed a nonexistent "TopKPatternExtended" competency with DELEGATES + a nonexistent SELF_RECURSIVE
      primitive and a Q5 figure of "79.7% -> 91.9%" months before any of this was real -- see
      VERSIONING.md's own corrections section and provenance/detector-version-log.md for the full, carefully
      hedged writeup of that coincidence.
    required_for_publication: true

