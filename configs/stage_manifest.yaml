  - id: q5_final_extended
    question: 5
    label: "function-scoped, TopKPatternExtended = ANY(TopKPattern, TopKViaDelegate, SortThenSlice)"
    taxonomy_checkpoint: taxonomy/v1.0.0-baseline
    detector_checkpoint: detectors/q5-delegation-clustering-fix
